    <meta name="color-scheme" content="dark" />
    <style>
      html,body{margin:0;min-height:100%;background:#090909;color:#f5f3ef;color-scheme:dark}
      html[data-lourex-surface=dark],html[data-lourex-surface=dark] body{background:#090909;color-scheme:dark!important}
      .lrx-boot{min-height:100vh;min-height:100dvh;display:grid;place-content:center;justify-items:center;gap:20px;background:#090909;color:#d8b577;font:700 14px system-ui;letter-spacing:.2em}
      .lrx-boot img{width:72px;height:72px;object-fit:contain}
    </style>
    <script>
      // LOUREX has one permanent dark appearance. Clear older day-mode preferences.
      try { localStorage.setItem('theme', 'dark'); } catch (_) {}
      document.documentElement.classList.remove('light');
      document.documentElement.classList.add('dark');
      document.documentElement.dataset.lourexSurface = 'dark';
    </script>
