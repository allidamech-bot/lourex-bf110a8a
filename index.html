<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1d2d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="LOUREX Invoice"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./app.bundle.css"><title>LOUREX Invoice</title><style>html,body,#root{min-height:100%;margin:0}.boot-fallback{min-height:100vh;display:grid;place-items:center;background:#f7f4ee;color:#15202b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center;padding:24px}.boot-fallback b{font-size:28px}.boot-fallback span{display:block;margin-top:12px;color:#737b82}.boot-fallback.error b{color:#8b1e1e;font-size:20px}</style></head><body><div id="root"><div class="boot-fallback"><div><b>LOUREX Invoice</b><span>Starting secure local workspace…</span></div></div></div><script>window.__lourexStarted=false;window.addEventListener('error',function(e){var r=document.getElementById('root');if(r&&!window.__lourexStarted)r.innerHTML='<div class="boot-fallback error"><div><b>LOUREX failed to start</b><span>'+String(e.message||'Unknown browser error').replace(/[&<>]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m]})+'</span></div></div>'});setTimeout(function(){var r=document.getElementById('root');if(r&&r.querySelector('.boot-fallback'))r.innerHTML='<div class="boot-fallback error"><div><b>LOUREX loading timed out</b><span>The browser could not load one of the application files.</span></div></div>'},12000);</script><script crossorigin src="https://cdn.jsdelivr.net/npm/react@16.0.0/umd/react.production.min.js"></script><script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@16.0.1/umd/react-dom.production.min.js"></script><script src="./app.bundle.js" onload="window.__lourexStarted=true"></script></body></html>
