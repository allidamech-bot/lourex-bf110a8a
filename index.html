<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LOUREX Invoice</title><style>html,body{margin:0;background:#f7f4ee;font-family:system-ui}#s{display:grid;place-items:center;min-height:100vh;color:#0b1d2d}.e{max-width:520px;padding:24px}</style></head><body><div id="s">Loading LOUREX Invoice…</div><script>(async()=>{try{const t=await fetch('./app.gz.b64',{cache:'no-store'}).then(r=>r.text());const b=Uint8Array.from(atob(t.trim()),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('s').innerHTML='<div class="e"><b>LOUREX Invoice</b><br><br>Unable to load the application. Please refresh the page.</div>';console.error(e)}})();</script></body></html>
