name: R1 PostgreSQL security integration

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261013160000_r1_profile_privilege_guard.sql'
      - 'supabase/tests/r1_profile_guard_pg17_integration.sql'
      - 'supabase/migrations/20261013163000_r1_partner_read_isolation_live_schema.sql'
      - 'supabase/tests/r1_partner_read_pg17_integration.sql'
      - '.github/workflows/r1-postgres-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-privileges-pg17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Execute profile privilege migration against disposable PostgreSQL 17
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=ephemeral-ci-only \
            -v "$PWD:/workspace:ro" \
            postgres:17 \
            psql -X -h 127.0.0.1 -U postgres -d postgres \
              -v ON_ERROR_STOP=1 -f /workspace/supabase/tests/r1_profile_guard_pg17_integration.sql

      - name: Execute partner read isolation against disposable PostgreSQL 17
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=ephemeral-ci-only \
            -v "$PWD:/workspace:ro" \
            postgres:17 \
            psql -X -h 127.0.0.1 -U postgres -d postgres \
              -v ON_ERROR_STOP=1 -f /workspace/supabase/tests/r1_partner_read_pg17_integration.sql
