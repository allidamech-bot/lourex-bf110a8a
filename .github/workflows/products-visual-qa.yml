name: LOUREX site visual QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/lourex-products-experience]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: products-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HERO_UI: ${{ github.head_ref == 'fix/lourex-living-hero' }}
      PRODUCT_HANDOFF_QA: ${{ github.head_ref == 'fix/p1-real-product-request-handoff' }}
      CATALOG_P0: ${{ github.head_ref == 'fix/p0-catalog-readiness-security' }}
      FOCUSED_UI: ${{ startsWith(github.head_ref, 'fix/lourex-') || github.head_ref == 'fix/transparent-hero-header-bilingual' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Compare TypeScript diagnostics with the existing baseline
        run: node scripts/check-homepage-types.mjs
      - run: npx eslint src/pages/public/ProductsPage.tsx src/pages/public/RequestPage.tsx src/components/shared/TradeEmblem.tsx src/test/unit/productsPageExperience.test.tsx src/test/unit/requestPageExperience.test.tsx
      - run: npx eslint src/components/HeroSection.tsx src/components/home/TradeField.tsx src/components/home/SourcingIllustration.tsx src/pages/public/HomePage.tsx
      - if: env.FOCUSED_UI != 'true'
        run: npm test
      - run: node scripts/build-homepage-preview.mjs
      - run: npx playwright install --with-deps chromium webkit
      - name: Check catalog interactions and capture desktop and mobile sizes
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ && break || sleep 1; done
          if [ "$HERO_UI" = "true" ]; then
            node scripts/living-hero-qa.mjs
          elif [ "$PRODUCT_HANDOFF_QA" = "true" ]; then
            node scripts/products-visual-qa.mjs
            node scripts/site-polish-qa.mjs
            node scripts/interior-pages-qa.mjs
          elif [ "$CATALOG_P0" = "true" ]; then
            node scripts/products-visual-qa.mjs
            node scripts/site-polish-qa.mjs
            LOUREX_MOBILE_FIX_QA=1 node scripts/workspace-visual-qa.mjs
          elif [ "$FOCUSED_UI" = "true" ]; then
            node scripts/mobile-shell-qa.mjs
            node scripts/site-polish-qa.mjs
            node scripts/interior-pages-qa.mjs
            LOUREX_MOBILE_FIX_QA=1 node scripts/workspace-visual-qa.mjs
          else
            node scripts/products-visual-qa.mjs
            node scripts/site-visual-qa.mjs
            node scripts/workspace-visual-qa.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: products-screenshots-and-results
          path: |
            living-hero-qa/
            polish-qa/
            mobile-shell-qa/
            products-qa/
            site-qa/
            workspace-qa/
            interior-qa/
            homepage-types-*.txt
      - uses: actions/upload-artifact@v4
        with:
          name: products-built-preview
          path: dist/
