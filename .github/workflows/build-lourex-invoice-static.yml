name: Build LOUREX Invoice Static

on:
  push:
    branches:
      - deploy/lourex-invoice-netlify
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: deploy/lourex-invoice-netlify
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build static bundle
        run: npm run build

      - name: Publish generated files into repository
        run: |
          mkdir -p public-dist
          cp dist/app.bundle.js public-dist/app.bundle.js
          cp dist/app.bundle.css public-dist/app.bundle.css
          cp dist/manifest.webmanifest public-dist/manifest.webmanifest
          cat > public-dist/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1d2d"><link rel="stylesheet" href="./app.bundle.css"><title>LOUREX Invoice</title></head><body><div id="root"></div><script crossorigin src="https://cdn.jsdelivr.net/npm/react@16.0.0/umd/react.production.min.js"></script><script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@16.0.1/umd/react-dom.production.min.js"></script><script src="./app.bundle.js"></script></body></html>
          HTML

      - name: Commit generated static bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-dist
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "chore: publish LOUREX Invoice static bundle [skip ci]"
            git push origin HEAD:deploy/lourex-invoice-netlify
          fi
