name: R1 customer upsert PostgreSQL integration

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261013160500_r1_customer_upsert_verified_identity.sql'
      - 'supabase/tests/r1_customer_upsert_pg17_integration.sql'
      - 'supabase/migrations/20261013162000_r1_existing_schema_partner_containment.sql'
      - 'supabase/tests/r1_partner_scope_pg17_integration.sql'
      - 'supabase/migrations/20261013163000_r1_global_reporting_owner_ops_only.sql'
      - 'supabase/tests/r1_report_rpcs_pg17_integration.sql'
      - '.github/workflows/r1-customer-upsert-pg17.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  customer-upsert-pg17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test authenticated and anonymous customer upsert against PostgreSQL 17
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=ephemeral-ci-only \
            -v "$PWD:/workspace:ro" \
            postgres:17 \
            psql -X -h 127.0.0.1 -U postgres -d postgres \
              -v ON_ERROR_STOP=1 -f /workspace/supabase/tests/r1_customer_upsert_pg17_integration.sql

      - name: Test multi-partner read isolation against PostgreSQL 17
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=ephemeral-ci-only \
            -v "$PWD:/workspace:ro" \
            postgres:17 \
            psql -X -h 127.0.0.1 -U postgres -d postgres \
              -v ON_ERROR_STOP=1 -f /workspace/supabase/tests/r1_partner_scope_pg17_integration.sql

      - name: Test owner-only global reports using real PostgreSQL 17 RPCs
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=ephemeral-ci-only \
            -v "$PWD:/workspace:ro" \
            postgres:17 \
            psql -X -h 127.0.0.1 -U postgres -d postgres \
              -v ON_ERROR_STOP=1 -f /workspace/supabase/tests/r1_report_rpcs_pg17_integration.sql
